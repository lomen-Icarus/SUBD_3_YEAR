# Лабораторная работа №1: PostgreSQL в Docker.
# Запуск:   docker compose up -d
# Останов:  docker compose down        (данные сохраняются в томе pgdata)
# Сброс:    docker compose down -v     (удаляет и данные)
services:
  db:
    image: postgres:16
    container_name: subd_lab_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres   # учебная локальная БД
      POSTGRES_DB: test_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql:/sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d test_db"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
